name = "agent-tower"
compatibility_date = "2026-07-01"
pages_build_output_dir = "dist"

# Cloudflare D1 (edge SQLite) -- accounts and saved workspace state.
# SHARED with social-pulse and yt-intel-one. Cloudflare's free tier caps D1 at 10
# databases per account, so these three share one rather than costing three slots.
# Tenancy is enforced by users.app with a unique index on (app, email), and by
# APP.scope in functions/_lib/appconfig.ts. Dropping that scope would merge the
# three user bases into one -- proven by auth-kit/test/tenancy.mjs, which goes red
# the moment the app filter is removed.
[[d1_databases]]
binding = "DB"
database_name = "fleet-shared-db"
database_id = "c0b239d8-46ce-4407-b3fe-96dda691abf5"
migrations_dir = "migrations"

# Plain-text configuration. NOTE: [vars] is replace-not-merge: any var missing
# from this block is dropped from the deployment. Secrets (BREVO_API_KEY,
# RATE_LIMIT_SALT) are set with `wrangler pages secret put` and never appear here.
[vars]
SITE_URL   = "https://agent-tower-34v.pages.dev"
MAIL_FROM  = "no-reply@txeas.com"
CONTACT_TO = "brianference@protonmail.com"
